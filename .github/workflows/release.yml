name: Release

# Zwei Wege zur fertigen Exe:
#   1. Tag pushen  -> git tag v0.2.1 && git push origin v0.2.1
#   2. Von Hand    -> Actions > Release > "Run workflow", Version eintippen
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version inklusive v, z. B. v0.2.1"
        required: true
        default: "v0.2.1"

# Der Job legt eine Release an und hängt den Installer dran.
permissions:
  contents: write

jobs:
  windows:
    # server2pick ist Windows-only: die Firewall-Regeln laufen über PowerShell.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Beides bricht den Build sonst erst ganz am Ende ab — das Secret nach
      # dem kompletten Rust-Build, der Platzhalter-Key sogar überhaupt nicht:
      # das Release ginge raus und wäre für die Installierenden eine Sackgasse,
      # weil ihre App keine Signatur mehr prüfen kann.
      - name: Signaturschlüssel prüfen
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          fail=0
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt oder ist leer. Den kompletten Inhalt der .key-Datei unter Settings > Secrets and variables > Actions hinterlegen."
            fail=1
          fi
          if grep -q 'PUBKEY_HIER_EINSETZEN' src-tauri/tauri.conf.json; then
            echo "::error::In src-tauri/tauri.conf.json steht noch der Platzhalter statt des Public Key. Ein Release damit koennte nie wieder aktualisiert werden."
            fail=1
          fi
          exit $fail

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Version in die Manifeste schreiben
        shell: bash
        # Den Dateinamen des Installers bestimmt tauri.conf.json, nicht der Tag.
        # Ohne diesen Schritt hieße die Datei aus Tag v0.3.0 weiterhin 0.2.0.
        # Cargo.toml muss mit, weil der Updater Versionen vergleicht.
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.version.outputs.number }}';
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargo = 'src-tauri/Cargo.toml';
            const text = fs.readFileSync(cargo, 'utf8');
            const patched = text.replace(/^version = \".*\"$/m, 'version = \"' + version + '\"');
            if (patched === text) throw new Error('Version in ' + cargo + ' nicht gefunden');
            fs.writeFileSync(cargo, patched);
            console.log('Version gesetzt:', version);
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Bauen und veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Updater-Artefakte. Ohne diese beiden Secrets bricht der
          # Build ab, sobald createUpdaterArtifacts aktiv ist — Absicht: ein
          # unsigniertes Release könnte von keiner Installation eingespielt
          # werden und wäre eine stille Sackgasse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: server2pick ${{ steps.version.outputs.tag }}
          # Erzeugt latest.json und hängt es ans Release — genau die Datei, die
          # der Updater unter .../releases/latest/download/latest.json abfragt.
          includeUpdaterJson: true
          # Englisch, im Gegensatz zum Rest dieser Datei: diesen Text lesen die
          # Leute auf der Releases-Seite, nicht wir.
          # Written for the Releases page, so it answers the three questions
          # people actually arrive with: which file, what Windows will say, and
          # what it needs to run. The updater artifacts sit in the same asset
          # list and look like something to download, hence the note.
          releaseBody: |
            ### Download

            👉 **[server2pick_${{ steps.version.outputs.number }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/server2pick_${{ steps.version.outputs.number }}_x64-setup.exe)**

            That is the only file you need. The `.sig` and `latest.json` next to
            it belong to the built-in updater.

            ### First launch

            Windows will show "Unknown publisher". The app is not code signed,
            so click **More info**, then **Run anyway**.

            ### Good to know

            Measuring ping works right away. Blocking servers writes Windows
            Firewall rules, so it asks for administrator rights once.

            Runs on Windows 10 and 11. Supports Deadlock, Counter-Strike 2,
            Dota 2 and Team Fortress 2.

            ---

            > "Have fun, and better pings."
            >
            > – Kay
          releaseDraft: false
          prerelease: false
